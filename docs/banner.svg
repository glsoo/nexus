<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">Nexus</title>
  <desc id="d">Your own AI coding agent. Self-hosted, in the browser and on your phone.</desc>
  <defs>
    <radialGradient id="glow" cx="22%" cy="50%" r="60%">
      <stop offset="0" stop-color="#7e22ce" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#3b0764" stop-opacity=".25"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="88%" cy="15%" r="45%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".16"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#e9d5ff"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridmask"><rect width="1280" height="400" fill="url(#fade)"/></mask>
    <clipPath id="titleclip"><text x="300" y="196" class="title">Nexus</text></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <style>
    .title { font: 800 128px ui-monospace, 'JetBrains Mono', 'SF Mono', 'Cascadia Mono', Consolas, monospace; letter-spacing: -4px; }
    .tag { font: 500 30px system-ui, -apple-system, 'Segoe UI', Inter, Roboto, sans-serif; fill: #d4d4d8; }
    .chip text { font: 600 19px system-ui, -apple-system, 'Segoe UI', Inter, Roboto, sans-serif; fill: #f5f5f5; }
    .chip rect { fill: #111; stroke: #3f3f46; }
    .chip.hot rect { fill: #2e1065; stroke: #7e22ce; }
    .pulse { animation: pulse 6s ease-in-out infinite; transform-origin: 280px 200px; }
    .draw { stroke-dasharray: 80; stroke-dashoffset: 80; animation: draw 1.6s cubic-bezier(.22,1,.36,1) .2s forwards; }
    .sweep { animation: sweep 5s cubic-bezier(.45,0,.2,1) 1.2s infinite; }
    .chip { opacity: 0; animation: rise .7s cubic-bezier(.22,1,.36,1) forwards; }
    .c1 { animation-delay: .5s } .c2 { animation-delay: .62s } .c3 { animation-delay: .74s } .c4 { animation-delay: .86s } .c5 { animation-delay: .98s }
    @keyframes pulse { 0%, 100% { opacity: .75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes sweep { 0% { transform: translateX(-380px); } 60%, 100% { transform: translateX(760px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .draw { stroke-dashoffset: 0; } .chip { opacity: 1; } }
  </style>

  <rect width="1280" height="400" fill="#000"/>
  <rect width="1280" height="400" fill="url(#grid)" mask="url(#gridmask)"/>
  <rect width="1280" height="400" fill="url(#glow)" class="pulse"/>
  <rect width="1280" height="400" fill="url(#glow2)"/>

  <!-- the logo: the app's own N mark -->
  <g transform="translate(96 104) scale(6)">
    <rect width="32" height="32" rx="7" fill="#0a0a0a" stroke="#3b0764" stroke-width=".4"/>
    <path d="M9 23V9l14 14V9" fill="none" stroke="#a855f7" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)" opacity=".55"/>
    <path class="draw" pathLength="80" d="M9 23V9l14 14V9" fill="none" stroke="#7e22ce" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="300" y="196" class="title" fill="url(#title)">Nexus</text>
  <g clip-path="url(#titleclip)"><g transform="skewX(-18)"><rect class="sweep" x="330" y="80" width="140" height="140" fill="url(#sweep)" opacity=".35"/></g></g>

  <text x="304" y="252" class="tag">Your own AI coding agent, self-hosted, on any screen.</text>

  <!-- each chip sits in a positioned group, because the fade-in animates transform and would override a transform attribute -->
  <g transform="translate(304 290)">
    <g><g class="chip hot c1"><rect width="158" height="44" rx="22"/><text x="79" y="29" text-anchor="middle">Claude + GPT</text></g></g>
    <g transform="translate(172 0)"><g class="chip c2"><rect width="166" height="44" rx="22"/><text x="83" y="29" text-anchor="middle">120+ agents</text></g></g>
    <g transform="translate(352 0)"><g class="chip c3"><rect width="196" height="44" rx="22"/><text x="98" y="29" text-anchor="middle">MCP marketplace</text></g></g>
    <g transform="translate(562 0)"><g class="chip c4"><rect width="146" height="44" rx="22"/><text x="73" y="29" text-anchor="middle">Phone-ready</text></g></g>
    <g transform="translate(722 0)"><g class="chip c5"><rect width="190" height="44" rx="22"/><text x="95" y="29" text-anchor="middle">Linux + Windows</text></g></g>
  </g>
</svg>
